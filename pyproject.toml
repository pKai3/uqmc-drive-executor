[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uqmc-drive-executor"
version = "0.1.0"
description = "Local Drive recovery journal, fixture executor and read-only agent receipt bridge"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
direct = [
    "google-api-python-client>=2.160,<3",
    "google-auth>=2.38,<3",
    "google-auth-httplib2>=0.2,<1",
    "httplib2>=0.22,<1",
]

[tool.setuptools.packages.find]
include = ["uqmc_recovery*"]
